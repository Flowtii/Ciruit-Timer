<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zirkeltraining Timer</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header>
            <h1>Circuit Timer</h1>
            <button id="settings-btn" class="icon-btn" aria-label="Einstellungen">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
            </button>
        </header>

        <!-- Main Timer Area -->
        <main class="timer-section">
            <div class="timer-container">
                <svg class="progress-ring" viewBox="0 0 100 100">
                    <circle class="progress-ring__background" cx="50" cy="50" r="45"></circle>
                    <circle class="progress-ring__circle" cx="50" cy="50" r="45"></circle>
                </svg>
                <div class="timer-display">
                    <div id="phase-text" class="phase-text">BEREIT</div>
                    <div id="time-text" class="time-text">00:00</div>
                    <div id="round-text" class="round-text">Runde 0 / 10</div>
                </div>
            </div>

            <!-- Controls -->
            <div class="controls">
                <button id="reset-btn" class="control-btn secondary">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path></svg>
                </button>
                <button id="play-pause-btn" class="control-btn primary">
                    <svg id="play-icon" width="32" height="32" viewBox="0 0 24 24" fill="currentColor"><path d="M5 3l14 9-14 9V3z"></path></svg>
                    <svg id="pause-icon" class="hidden" width="32" height="32" viewBox="0 0 24 24" fill="currentColor"><path d="M6 4h4v16H6zM14 4h4v16h-4z"></path></svg>
                </button>
            </div>
        </main>

        <!-- Settings Modal (Hidden by default) -->
        <div id="settings-modal" class="modal hidden">
            <div class="modal-content">
                <h2>Einstellungen</h2>
                
                <div class="setting-group">
                    <label for="work-time">Belastung (Sekunden)</label>
                    <div class="input-wrapper">
                        <button class="adjust-btn" data-target="work-time" data-change="-5">-</button>
                        <input type="number" id="work-time" value="45" min="5" max="300" step="5">
                        <button class="adjust-btn" data-target="work-time" data-change="5">+</button>
                    </div>
                </div>

                <div class="setting-group">
                    <label for="rest-time">Pause (Sekunden)</label>
                    <div class="input-wrapper">
                        <button class="adjust-btn" data-target="rest-time" data-change="-5">-</button>
                        <input type="number" id="rest-time" value="15" min="5" max="300" step="5">
                        <button class="adjust-btn" data-target="rest-time" data-change="5">+</button>
                    </div>
                </div>

                <div class="setting-group">
                    <label for="rounds">Rundenanzahl</label>
                    <div class="input-wrapper">
                        <button class="adjust-btn" data-target="rounds" data-change="-1">-</button>
                        <input type="number" id="rounds" value="10" min="1" max="50" step="1">
                        <button class="adjust-btn" data-target="rounds" data-change="1">+</button>
                    </div>
                </div>
                
                <div class="setting-group checkbox-group">
                    <label for="sound-toggle">Ton aktivieren</label>
                    <label class="switch">
                        <input type="checkbox" id="sound-toggle" checked>
                        <span class="slider round"></span>
                    </label>
                </div>

                <button id="save-settings-btn" class="save-btn">Speichern</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW failed', err));
            });
        }
    </script>
</body>
</html>
